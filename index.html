<!DOCTYPE html>

<head>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,650;1,650&display=swap"

<body class="text-white">

    <section class="text-center front-logo">
        <img src="Picture/Logo/MMB-FRONT-LOGO.png" class="zooming-image">
    </section>

    <section class="d-flex gap-5">
        <div style="padding-left:10%;" class="d-flex gap-3 mx-5 magna-agun">
            <div>
                <i style="color: #f39530; font-size: 250%; margin-top: 10%;" class="fa-solid fa-fire"></i>
            </div>
            <div id="serverBox" class="copy-link">
                <p style="margin-right: 15%;"><span>DRAGON.SENXCLOUD.COM:25590</span> <span
                        style="font-size: 80%; margin-top: -50%; color: #ffffff !important;">Click To
                        Copy</span></p>
            </div>
        </div>
        <div class="magna-agun d-flex ms-5" style="padding-left: 9%;">
            <div id="serverBox" class="copy-link">
                <a href="https://discord.gg/s6dsrj6sx"
                    style="margin-left: 30%; color: #f39530; text-decoration: none;">DISCORD SERVER <span
                        style="font-size: 80%; margin-top: -50%; color: #ffffff !important; margin-left: 57%;">Click To

            </div>
            <div>
                <i style="color: #f39530; font-size: 250%; margin-top: 10%;" class="fa-brands fa-discord"></i>
            </div>
        </div>
    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="copyToast" class="toast align-items-center text-bg-dark border-0" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">Link copied to clipboard!</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <section class="d-flex">
        <div class="mx-5 ms-5" style="margin-right:200% ;">
            <ul class="list-group list-group-flush ms-5" data-bs-theme="dark">
                <li class="list-group-item"> Select category</li>
                <li class="list-group-item list-group-item-action">An item</li>
                <li class="list-group-item list-group-item-action">A second item</li>
                <li class="list-group-item list-group-item-action">A third item</li>
                <li class="list-group-item list-group-item-action">A fourth item</li>
                <li class="list-group-item list-group-item-action">And a fifth one</li>
            </ul>
